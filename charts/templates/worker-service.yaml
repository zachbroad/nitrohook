apiVersion: v1
kind: Service
metadata:
  name: {{ include "nitrohook.fullname" . }}-worker
  labels:
    {{- include "nitrohook.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "nitrohook.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - port: 8081
      targetPort: health
      protocol: TCP
      name: health
